<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#111115" stroke="url(#glowGrad)" stroke-width="2" />
  <g filter="url(#neonGlow)" transform="translate(12, 10)">
    <!-- Soundwaves -->
    <line x1="2" y1="22" x2="2" y2="22" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
    <line x1="6" y1="18" x2="6" y2="26" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
    <line x1="10" y1="14" x2="10" y2="30" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="30" y1="14" x2="30" y2="30" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="34" y1="18" x2="34" y2="26" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" />
    <line x1="38" y1="22" x2="38" y2="22" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" />
    <!-- Microphone body -->
    <rect x="15" y="6" width="10" height="18" rx="5" fill="url(#glowGrad)" />
    <!-- Microphone stand curve -->
    <path d="M12 18 C12 28 28 28 28 18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9" />
    <!-- Stand stem and base -->
    <line x1="20" y1="28" x2="20" y2="36" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    <line x1="14" y1="36" x2="26" y2="36" stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
